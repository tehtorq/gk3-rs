[workspace]
resolver = "3"
members = ["crates/barn", "crates/formats", "crates/media", "crates/render", "gk3"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.88"

[workspace.dependencies]
gk3-barn = { path = "crates/barn" }
gk3-formats = { path = "crates/formats" }
gk3-media = { path = "crates/media" }
gk3-render = { path = "crates/render" }
miniz_oxide = "0.8"
# Only the native backends; wgpu loads the GPU driver at run time.
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "vulkan", "gles", "metal", "dx12", "wgsl"] }
winit = "0.30"
glam = { version = "0.30", features = ["bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
