[workspace]
resolver = "3"
members = ["crates/audio", "crates/barn", "crates/bink", "crates/formats", "crates/game", "crates/media", "crates/render", "crates/sheep", "crates/web", "gk3"]
# The browser build is made for wasm32 on its own (see crates/web).
default-members = ["crates/audio", "crates/barn", "crates/bink", "crates/formats", "crates/game", "crates/media", "crates/render", "crates/sheep", "gk3"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.88"

[workspace.dependencies]
gk3-audio = { path = "crates/audio" }
gk3-barn = { path = "crates/barn" }
gk3-bink = { path = "crates/bink" }
gk3-formats = { path = "crates/formats" }
gk3-game = { path = "crates/game" }
gk3-media = { path = "crates/media" }
gk3-render = { path = "crates/render" }
gk3-sheep = { path = "crates/sheep" }
miniz_oxide = "0.8"
# Only the native backends; wgpu loads the GPU driver at run time.
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "vulkan", "gles", "metal", "dx12", "wgsl"] }
winit = "0.30"
glam = { version = "0.30", features = ["bytemuck", "serde"] }
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
# Saved games: a snapshot of the running world.
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true

# The browser build: optimised, but without the release build's whole-
# program optimisation, which takes more memory than most machines spare.
[profile.web]
inherits = "release"
lto = false
codegen-units = 16
